spring.application.name=agendashows
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# E-mail: o envio do relatório semanal só é habilitado quando MAIL_HOST está definido.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_SENHA:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

app.relatorio-email.transporte=${EMAIL_TRANSPORTE:smtp}
app.relatorio-email.remetente=${MAIL_REMETENTE:${MAIL_USUARIO:}}
app.relatorio-email.nome-remetente=${MAIL_NOME_REMETENTE:Agenda de Shows}
app.relatorio-email.cron=${EMAIL_RELATORIO_CRON:0 0 8 * * MON}
app.relatorio-email.fuso=${APP_FUSO:America/Sao_Paulo}

# Calendário (iCalendar): feed de assinatura para o Apple Calendar.
# Sem CALENDARIO_TOKEN o feed fica desabilitado. Gere um valor com: openssl rand -hex 24
app.calendario.token=${CALENDARIO_TOKEN:}
app.calendario.fuso=${APP_FUSO:America/Sao_Paulo}
app.calendario.duracao-padrao-minutos=${CALENDARIO_DURACAO_MINUTOS:180}

# Transporte Brevo (API HTTPS): usado quando EMAIL_TRANSPORTE=brevo.
app.relatorio-email.brevo.api-key=${BREVO_API_KEY:}
app.relatorio-email.brevo.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
