spring.application.name=agendashows

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agendashows}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

app.usuario-inicial.nome=${USUARIO_INICIAL:}
app.usuario-inicial.senha=${SENHA_INICIAL:}
