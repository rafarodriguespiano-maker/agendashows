spring.application.name=agendashows
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# E-mail: o envio do relatório semanal só é habilitado quando MAIL_HOST está definido.
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_SENHA:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

app.relatorio-email.remetente=${MAIL_REMETENTE:${MAIL_USUARIO:}}
app.relatorio-email.cron=${EMAIL_RELATORIO_CRON:0 0 8 * * MON}
app.relatorio-email.fuso=${APP_FUSO:America/Sao_Paulo}
