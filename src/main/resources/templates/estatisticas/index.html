<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Estatísticas')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/base :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/base :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Estatísticas</h1>
        <a class="btn btn-outline-secondary" th:href="@{/shows(mes=${filtro.mes},ano=${filtro.ano})}">Voltar para a agenda</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form id="filtro" th:action="@{/estatisticas}" method="get" th:object="${filtro}" class="row g-2 align-items-end">
                <div class="col-6 col-md-3">
                    <label class="form-label small">Mês</label>
                    <select class="form-select" th:field="*{mes}">
                        <option value="">Todos</option>
                        <option th:each="mes : ${meses}" th:value="${mes.key}" th:text="${mes.value}"></option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label small">Ano</label>
                    <input type="number" class="form-control" min="1" max="9999" th:field="*{ano}">
                </div>
                <div class="col-12 col-md-7 d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-secondary">Filtrar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/estatisticas}">Período atual</a>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Shows no período</div>
                    <div class="fs-3 fw-semibold" th:text="${resumo.quantidadeShows}">0</div>
                    <div class="text-muted small">
                        <span th:text="${resumo.quantidadePagas}">0</span> pagos ·
                        <span th:text="${resumo.quantidadePendentes}">0</span> pendentes
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Cachê total</div>
                    <div class="fs-3 fw-semibold" th:text="${#numbers.formatCurrency(resumo.cacheTotal)}">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Cachê pago</div>
                    <div class="fs-3 fw-semibold text-success" th:text="${#numbers.formatCurrency(resumo.cachePago)}">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Cachê pendente</div>
                    <div class="fs-3 fw-semibold text-danger" th:text="${#numbers.formatCurrency(resumo.cachePendente)}">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Cachê médio</div>
                    <div class="fs-3 fw-semibold" th:text="${#numbers.formatCurrency(resumo.cacheMedio)}">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Maior cachê</div>
                    <div class="fs-3 fw-semibold" th:text="${#numbers.formatCurrency(resumo.maiorCache)}">R$ 0,00</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h2 class="h6 mb-0">Ranking de artistas</h2>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="d-none d-md-table-cell">#</th>
                    <th>Artista</th>
                    <th class="text-end">Shows</th>
                    <th class="text-end">Cachê acumulado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(ranking)}">
                    <td colspan="4" class="text-center text-muted py-4">Nenhum show encontrado no período.</td>
                </tr>
                <tr th:each="item, iter : ${ranking}">
                    <td class="d-none d-md-table-cell text-muted" th:text="${iter.count}"></td>
                    <td th:text="${item.artista}"></td>
                    <td class="text-end" th:text="${item.quantidadeShows}"></td>
                    <td class="text-end" th:text="${#numbers.formatCurrency(item.cacheTotal)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script th:replace="~{fragments/base :: scripts}"></script>
<script>
    (function () {
        const form = document.getElementById('filtro');
        if (!form) {
            return;
        }

        form.querySelectorAll('select, input[type="number"]').forEach(function (campo) {
            campo.addEventListener('change', function () {
                form.requestSubmit();
            });
        });
    })();
</script>
</body>
</html>
