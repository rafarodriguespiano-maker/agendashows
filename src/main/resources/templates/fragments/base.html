<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Agenda de Shows - ' + ${titulo}">Agenda de Shows</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Observações: quebra de linha no celular e truncamento no desktop */
        .obs-show {
            max-width: 260px;
            overflow-wrap: anywhere;
        }

        /* Shows já ocorridos: esmaecidos para destacar os próximos */
        tr.show-passado > td {
            opacity: 0.5;
        }

        tr.show-passado:hover > td {
            opacity: 0.85;
        }

        /* Ações de shows passados: o dropdown fica opaco para não atrapalhar a leitura */
        tr.show-passado > td:last-child {
            opacity: 1;
        }

        tr.show-passado > td:last-child > *:not(.dropdown) {
            opacity: 0.5;
        }

        tr.show-passado:hover > td:last-child {
            opacity: 1;
        }

        tr.show-passado:hover > td:last-child > *:not(.dropdown) {
            opacity: 0.85;
        }

        /* Badge "Mensal" de shows já ocorridos: tons de cinza */
        tr.show-passado .badge.text-bg-info {
            background-color: var(--bs-gray-500) !important;
            color: #fff !important;
        }

        /* Logo da navbar */
        .navbar-logo {
            height: 56px;
            width: auto;
        }

        /* Navbar: usuário logado sem estourar a largura em telas estreitas */
        .usuario-logado {
            max-width: 45vw;
        }

        @media (min-width: 992px) {
            .obs-show {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-lg flex-wrap">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/estatisticas}">
            <img th:src="@{/img/logo.png}" src="/img/logo.png" alt="Agenda de Shows" class="navbar-logo">
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/shows(mes=${mes},ano=${ano})}">Shows</a>
            <a class="nav-link" th:href="@{/estatisticas(mes=${mes},ano=${ano})}">Estatísticas</a>
        </div>
        <form th:action="@{/sair}" method="post" class="d-flex align-items-center gap-2 ms-auto">
            <span class="text-light small text-truncate usuario-logado" sec:authentication="name"></span>
            <button type="submit" class="btn btn-outline-light btn-sm text-nowrap">Sair</button>
        </form>
    </div>
</nav>
<div th:fragment="messages">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
</div>
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
