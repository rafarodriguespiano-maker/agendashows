<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Agenda de Shows - ' + ${titulo}">Agenda de Shows</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/shows}">Agenda de Shows</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/shows(mes=${mes},ano=${ano})}">Shows</a>
            <a class="nav-link" th:href="@{/shows/novo(mes=${mes},ano=${ano})}">Novo show</a>
        </div>
        <form th:action="@{/sair}" method="post" class="d-flex align-items-center gap-2">
            <span class="text-light small" sec:authentication="name"></span>
            <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
        </form>
    </div>
</nav>
<div th:fragment="messages">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
</div>
</body>
</html>
