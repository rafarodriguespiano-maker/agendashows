name: agendashows-prod

services:
  mysql:
    image: mysql:8.4
    container_name: agendashows-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NOME:-agendashows}
      MYSQL_USER: ${DB_USUARIO:-agenda}
      MYSQL_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_SENHA:?defina DB_ROOT_SENHA no .env}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=60
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - interna

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agendashows:local
    container_name: agendashows-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://mysql:3306/${DB_NOME:-agendashows}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8"
      DB_USUARIO: ${DB_USUARIO:-agenda}
      DB_SENHA: ${DB_SENHA:?defina DB_SENHA no .env}
      USUARIO_INICIAL: ${USUARIO_INICIAL:-}
      SENHA_INICIAL: ${SENHA_INICIAL:-}
      TZ: America/Sao_Paulo
      COOKIE_SECURE: "true"
    expose:
      - "8080"
    networks:
      - interna

  caddy:
    image: caddy:2
    container_name: agendashows-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - interna

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
